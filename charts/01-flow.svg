<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" width="1680" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1680" height="900" fill="#181A1B"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c98500"/></marker></defs>
<text x="42" y="64" font-size="34" fill="#BBBDC0" font-weight="bold" text-anchor="start">How sulfur gets from an oil refinery to a farm field</text>
<text x="42" y="104" font-size="19" fill="#8A9098" font-weight="normal" text-anchor="start">Most sulfur is a leftover from cleaning up oil and gas. Most of it is made into sulfuric acid, and the largest use of that acid is phosphate fertilizer.</text>
<text x="42" y="162" font-size="14" fill="#6B7178" font-weight="bold" text-anchor="start">THE STEPS</text>
<rect x="42" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="72" cy="226" r="15" fill="#c98500"/>
<text x="72" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">1</text>
<text x="60" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">Sour oil and gas</text>
<text x="60" y="312.25" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">Much of the world’s crude</text>
<text x="60" y="334.33" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">oil and natural gas comes</text>
<text x="60" y="356.40999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">out of the ground with</text>
<text x="60" y="378.49" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">sulfur in it. Fuel rules</text>
<text x="60" y="400.57" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">require taking it out.</text>
<line x1="283" y1="340.0" x2="309" y2="340.0" stroke="#c98500" stroke-width="3" marker-end="url(#a)"/>
<rect x="314" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="344" cy="226" r="15" fill="#c98500"/>
<text x="344" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">2</text>
<text x="332" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">Refinery or gas</text>
<text x="332" y="300.25" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">plant</text>
<text x="332" y="338.5" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">The sulfur is stripped</text>
<text x="332" y="360.58" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">out as a gas, then turned</text>
<text x="332" y="382.65999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">into pure yellow sulfur.</text>
<text x="332" y="404.74" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">This step is called the</text>
<text x="332" y="426.82" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">Claus process.</text>
<line x1="555" y1="340.0" x2="581" y2="340.0" stroke="#c98500" stroke-width="3" marker-end="url(#a)"/>
<rect x="586" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="616" cy="226" r="15" fill="#c98500"/>
<text x="616" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">3</text>
<text x="604" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">Sulfur</text>
<text x="604" y="312.25" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">It moves as a hot liquid</text>
<text x="604" y="334.33" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">by rail, truck and ship,</text>
<text x="604" y="356.40999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">or is cooled into pellets</text>
<text x="604" y="378.49" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">and shipped in bulk like</text>
<text x="604" y="400.57" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">grain.</text>
<line x1="827" y1="340.0" x2="853" y2="340.0" stroke="#c98500" stroke-width="3" marker-end="url(#a)"/>
<rect x="858" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="888" cy="226" r="15" fill="#c98500"/>
<text x="888" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">4</text>
<text x="876" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">Sulfuric acid plant</text>
<text x="876" y="312.25" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">Sulfur is burned and the</text>
<text x="876" y="334.33" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">gas is turned into acid.</text>
<text x="876" y="356.40999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">One ton of sulfur makes</text>
<text x="876" y="378.49" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">about 3 tons of sulfuric</text>
<text x="876" y="400.57" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">acid.</text>
<line x1="1099" y1="340.0" x2="1125" y2="340.0" stroke="#c98500" stroke-width="3" marker-end="url(#a)"/>
<rect x="1130" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="1160" cy="226" r="15" fill="#c98500"/>
<text x="1160" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">5</text>
<text x="1148" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">Phosphoric acid</text>
<text x="1148" y="300.25" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">plant</text>
<text x="1148" y="338.5" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">The acid dissolves</text>
<text x="1148" y="360.58" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">crushed phosphate rock.</text>
<text x="1148" y="382.65999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">Phosphoric acid comes</text>
<text x="1148" y="404.74" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">out. Gypsum waste is left</text>
<text x="1148" y="426.82" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">behind.</text>
<line x1="1371" y1="340.0" x2="1397" y2="340.0" stroke="#c98500" stroke-width="3" marker-end="url(#a)"/>
<rect x="1402" y="190" width="236" height="300" rx="10" fill="#202325" stroke="#2A2D2F"/>
<circle cx="1432" cy="226" r="15" fill="#c98500"/>
<text x="1432" y="232" font-size="17" fill="#181A1B" font-weight="bold" text-anchor="middle">6</text>
<text x="1420" y="274.0" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">DAP and MAP</text>
<text x="1420" y="300.25" font-size="21" fill="#BBBDC0" font-weight="bold" text-anchor="start">fertilizer</text>
<text x="1420" y="338.5" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">Phosphoric acid is mixed</text>
<text x="1420" y="360.58" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">with ammonia. One ton of</text>
<text x="1420" y="382.65999999999997" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">DAP takes about 0.4 tons</text>
<text x="1420" y="404.74" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">of sulfur.</text>
<text x="42" y="538" font-size="14" fill="#6B7178" font-weight="bold" text-anchor="start">HOW MUCH IS SITTING IN STORAGE AT EACH STEP, AS FAR AS THE PUBLIC CAN SEE</text>
<line x1="432.0" y1="496" x2="432.0" y2="558" stroke="#2A2D2F" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="314" y="560" width="236" height="200" rx="10" fill="none" stroke="#c98500" stroke-width="2" />
<text x="332" y="596.0" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">U.S. producers: 122,000</text>
<text x="332" y="618.08" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">tons, about 6 days of</text>
<text x="332" y="640.16" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">shipments (March 2026).</text>
<text x="332" y="678.24" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">Alberta stockpile: 11.0</text>
<text x="332" y="700.32" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">million tons (August</text>
<text x="332" y="722.4" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">2026).</text>
<line x1="704.0" y1="496" x2="704.0" y2="558" stroke="#2A2D2F" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="586" y="560" width="236" height="200" rx="10" fill="none" stroke="#c98500" stroke-width="2" />
<text x="604" y="596.0" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">China’s ports: 0.95</text>
<text x="604" y="618.08" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">million tons (late August</text>
<text x="604" y="640.16" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">2026), after 0.73 million</text>
<text x="604" y="662.24" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">in early July.</text>
<text x="604" y="700.3199999999999" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">On ships and at other</text>
<text x="604" y="722.4" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">ports: we found no public</text>
<text x="604" y="744.4799999999999" font-size="16" fill="#c98500" font-weight="bold" text-anchor="start">figure.</text>
<line x1="976.0" y1="496" x2="976.0" y2="558" stroke="#2A2D2F" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="858" y="560" width="236" height="200" rx="10" fill="none" stroke="#6B7178" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="876" y="596.0" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">We found no public</text>
<text x="876" y="618.08" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">figure.</text>
<text x="876" y="656.16" font-size="16" fill="#6B7178" font-weight="normal" text-anchor="start">Strong acid eats into</text>
<text x="876" y="678.24" font-size="16" fill="#6B7178" font-weight="normal" text-anchor="start">steel tanks and gives off</text>
<text x="876" y="700.3199999999999" font-size="16" fill="#6B7178" font-weight="normal" text-anchor="start">flammable hydrogen gas,</text>
<text x="876" y="722.4" font-size="16" fill="#6B7178" font-weight="normal" text-anchor="start">which makes it hard to</text>
<text x="876" y="744.48" font-size="16" fill="#6B7178" font-weight="normal" text-anchor="start">hold in bulk.</text>
<line x1="1248.0" y1="496" x2="1248.0" y2="558" stroke="#2A2D2F" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="1130" y="560" width="236" height="200" rx="10" fill="none" stroke="#6B7178" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="1148" y="596.0" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">We found no public</text>
<text x="1148" y="618.08" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">figure.</text>
<line x1="1520.0" y1="496" x2="1520.0" y2="558" stroke="#2A2D2F" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="1402" y="560" width="236" height="200" rx="10" fill="none" stroke="#6B7178" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="1420" y="596.0" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">We found no public</text>
<text x="1420" y="618.08" font-size="16" fill="#8A9098" font-weight="normal" text-anchor="start">figure.</text>
<text x="42" y="842" font-size="14" fill="#6B7178" font-weight="normal" text-anchor="start">Sources: U.S. Environmental Protection Agency (process steps), Chemical Engineering (acid storage), Mosaic annual report (sulfur per ton of DAP), U.S. Geological Survey,</text>
<text x="42" y="864" font-size="14" fill="#6B7178" font-weight="normal" text-anchor="start">Alberta Energy Regulator, and China port stocks as reported by CRU and SMM. Tons are metric tons. The acid figure is the chemical maximum. Acid is also used to process copper and nickel.</text>
<text x="1638" y="864" font-size="14" fill="#6B7178" font-weight="bold" text-anchor="end">Built by Data 4 The People</text>
</svg>